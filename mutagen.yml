sync:
  defaults:
    mode: two-way-resolved
    ignore:
      vcs: true
      paths:
        - node_modules
        - "**/node_modules"
        - .next
        - "**/.next"
        - dist
        - "**/dist"
        - build
        - "**/build"
        - target
        - "**/target"
        - .turbo
        - "**/.turbo"
        - coverage
        - "**/coverage"
        - "*.log"
        - ".DS_Store"
        - graphify-out
    permissions:
      defaultFileMode: 0644
      defaultDirectoryMode: 0755

  live2dev:
    alpha: /Users/ranaufal/MyWork/Business/Orphic/Merai/software-house/soho-icma
    beta: ifal@192.168.100.145:/home/ifal/workspace/business/orphic/clients/soho-icma
    flushOnCreate: true
